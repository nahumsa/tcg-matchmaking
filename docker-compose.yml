services:
  db:
    image: postgres:16-alpine
    container_name: tcg-db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: tcg_matchmaking
    ports:
      - "5432:5432"
    volumes:
      - tcg-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: tcg-backend
    environment:
      DATABASE_URL: postgresql://postgres:postgres@db:5432/tcg_matchmaking
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
      db-migrate:
        condition: service_completed_successfully

  db-migrate:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: tcg-db-migrate
    environment:
      DATABASE_URL: postgresql://postgres:postgres@db:5432/tcg_matchmaking
    command:
      ["uv", "run", "--project", "./backend", "alembic", "upgrade", "head"]
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
      args:
        - VITE_API_URL=http://localhost:8000
        - VITE_WS_URL=ws://localhost:8000
    container_name: tcg-frontend
    ports:
      - "8080:80"
    depends_on:
      - backend

volumes:
  tcg-db-data:
